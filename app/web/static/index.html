<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldTrend Pro</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--panel2:#eef1f6;--text:#1b2330;--muted:#6b7585;--line:#dde2ea;--gold:#b8860b;--up:#0f9d58;--down:#d93025;--warn:#e08a00;--accent:#2f5bea;--shadow:0 1px 3px rgba(20,30,50,.08)}
:root[data-theme=dark]{--bg:#0e131b;--panel:#161d28;--panel2:#1d2635;--text:#e6ebf3;--muted:#8d9ab0;--line:#27324a;--gold:#e6b84a;--up:#26c281;--down:#ff5c5c;--warn:#f0a63a;--accent:#6c8cff;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,"IRANSans","Segoe UI",Tahoma,sans-serif;font-size:14px}
#app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:54px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;color:var(--gold)}.logo small{color:var(--muted);font-weight:400;font-size:11px;margin-right:6px}
.sp{flex:1}.pill{padding:3px 10px;border-radius:12px;background:var(--panel2);font-size:12px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--up)}.pill.bad{color:var(--down)}.pill.warn{color:var(--warn)}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{background:var(--panel);border-left:1px solid var(--line);padding:10px 8px;overflow:auto}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--panel2)}nav a.act{background:var(--accent);color:#fff}
main{overflow:auto;padding:16px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.big{font-size:22px;font-weight:700;direction:ltr;text-align:right}.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.warn{color:var(--warn)}
.sig{display:inline-block;padding:6px 18px;border-radius:10px;font-weight:800;font-size:20px;letter-spacing:1px}
.sig.BUY{background:var(--up);color:#fff}.sig.SELL{background:var(--down);color:#fff}.sig.HOLD{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}
td.n{direction:ltr;text-align:left}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--down),var(--panel2) 50%,var(--up));position:relative}
.bar i{position:absolute;top:-4px;width:4px;height:18px;background:var(--text);border-radius:2px;transform:translateX(-2px)}
.chartwrap{position:relative}canvas{width:100%;display:block;border-radius:8px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;direction:rtl;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:5;white-space:nowrap}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.note{font-size:12px;color:var(--muted);line-height:1.8}.empty{padding:30px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-left:6px}@keyframes s{to{transform:rotate(360deg)}}
.pro-only{display:none}body.pro .pro-only{display:revert}body.pro .simple-only{display:none}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:10px;max-width:85%;white-space:pre-wrap;line-height:1.9}.msg.u{background:var(--accent);color:#fff;align-self:flex-start}.msg.a{background:var(--panel2);align-self:flex-end}
details{margin-top:6px}summary{cursor:pointer;color:var(--accent)}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--panel2);color:var(--muted)}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:54px auto 1fr}nav{display:flex;overflow:auto;border:0;border-bottom:1px solid var(--line)}nav a{white-space:nowrap}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">GoldTrend Pro<small>تحلیل و تصمیم‌یار بازار طلا</small></div>
  <span class="pill" id="conn">…</span><span class="pill" id="upd">—</span>
  <div class="sp"></div>
  <span id="busy"></span>
  <button id="bAlert" title="اعلان‌ها">🔔 <span id="alertN">0</span></button>
  <button id="bMode" title="حالت ساده / حرفه‌ای (m)">حالت: ساده</button>
  <button id="bTheme" title="تم (t)">☀/🌙</button>
  <button id="bRefresh" class="pri" title="دریافت داده و تحلیل مجدد (r)">به‌روزرسانی</button>
</header>
<nav id="nav"></nav>
<main id="view"><div class="empty"><span class="spin"></span>در حال بارگذاری…</div></main>
</div>
<script>
"use strict";
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const PAGES=[["dashboard","داشبورد"],["overview","نمای کلی بازار"],["technical","تحلیل تکنیکال"],["forecast","پیش‌بینی هوشمند"],["intermarket","تحلیل بین‌بازاری"],["patterns","الگوهای تاریخی"],["backtest","بک‌تست"],["assistant","دستیار هوشمند"],["sources","منابع داده"],["alerts","هشدارها"],["settings","تنظیمات"]];
const NAMES={GOLD18_IRR:"طلای ۱۸ عیار",USD_IRR:"دلار آزاد",XAU_USD:"انس جهانی"};
const UNITS={GOLD18_IRR:"تومان/گرم",USD_IRR:"تومان",XAU_USD:"دلار"};
const nf=(x,d=0)=>x==null||isNaN(x)?"—":Number(x).toLocaleString("fa-IR",{maximumFractionDigits:d,minimumFractionDigits:d}).replace(/٫/g,".").replace(/٬/g,",").replace(/\u2212/g,"-");
const pc=(x,d=2)=>x==null||isNaN(x)?"—":`<span dir="ltr">${x>0?"+":""}${nf(x,d)}%</span>`;
const cls=x=>x==null?"":x>0?"up":x<0?"down":"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function jal(iso){ if(!iso) return "—"; const [gy,gm,gd]=iso.slice(0,10).split("-").map(Number);
  const g=[0,31,59,90,120,151,181,212,243,273,304,334]; let gy2=gm>2?gy+1:gy;
  let days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g[gm-1];
  let jy=-1595+33*Math.floor(days/12053); days%=12053; jy+=4*Math.floor(days/1461); days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30), jd=1+(days<186?days%31:(days-186)%30);
  return nf(jy)+"/"+String(jm).padStart(2,"0").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])+"/"+String(jd).padStart(2,"0").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]); }
async function api(path,body){ const o=body!==undefined?{method:"POST",headers:{"Content-Type":"application/json","X-GT-Client":"1"},body:JSON.stringify(body)}:{};
  const r=await fetch(path,o); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||r.status); return r.json(); }
const S={snap:null,status:"starting",engine:{},page:"dashboard",mode:localStorage.getItem("gt_mode")||"simple",theme:localStorage.getItem("gt_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),asset:localStorage.getItem("gt_asset")||"GOLD18_IRR",days:localStorage.getItem("gt_days")||"365",hz:5,win:20};
const store=(k,v)=>{S[k.replace("gt_","")]=v;try{localStorage.setItem(k,v)}catch(e){}};

// ---------- interactive canvas chart ----------
class Chart{
  constructor(host,{panes,labels,fmt=v=>nf(v,0),onPoint}){ this.host=host; this.panes=panes; this.labels=labels; this.fmt=fmt; this.n=labels.length;
    this.i1=this.n; this.i0=Math.max(0,this.n-Math.min(this.n,260)); this.cross=null;
    host.innerHTML='<div class="chartwrap"><canvas></canvas><div class="tip"></div></div>'; this.cv=host.querySelector("canvas"); this.tip=host.querySelector(".tip");
    this.H=panes.reduce((a,p)=>a+p.h,0)+24; this.cv.style.height=this.H+"px";
    const ev=this.cv; ev.addEventListener("wheel",e=>{e.preventDefault();this.zoom(e)},{passive:false});
    ev.addEventListener("mousedown",e=>{this.drag=e.clientX;this.d0=[this.i0,this.i1]});
    window.addEventListener("mouseup",()=>this.drag=null);
    ev.addEventListener("mousemove",e=>this.move(e)); ev.addEventListener("mouseleave",()=>{this.cross=null;this.tip.style.display="none";this.draw()});
    new ResizeObserver(()=>this.draw()).observe(host); this.draw(); }
  setRange(k){ this.i1=this.n; this.i0=Math.max(0,this.n-(k||this.n)); this.draw(); }
  zoom(e){ const r=this.cv.getBoundingClientRect(); const f=(e.clientX-r.left)/r.width; // time axis runs left -> right
    const span=this.i1-this.i0, ns=Math.max(15,Math.min(this.n,span*(e.deltaY>0?1.2:.83))), c=this.i0+span*f;
    this.i0=Math.max(0,c-ns*f); this.i1=Math.min(this.n,this.i0+ns); this.i0=Math.max(0,this.i1-ns); this.draw(); }
  move(e){ const r=this.cv.getBoundingClientRect(); const x=e.clientX-r.left, W=r.width;
    if(this.drag!=null){ const dx=-(e.clientX-this.drag)/W*(this.d0[1]-this.d0[0]); let a=this.d0[0]+dx,b=this.d0[1]+dx; if(a<0){b-=a;a=0} if(b>this.n){a-=b-this.n;b=this.n} this.i0=Math.max(0,a);this.i1=Math.min(this.n,b); this.draw(); return; }
    const idx=Math.round(this.i0+((x-4)/(W-64))*(this.i1-this.i0)-.5); this.cross={x,idx:Math.max(0,Math.min(this.n-1,idx))}; this.draw(); this.showTip(e); }
  showTip(e){ const i=this.cross.idx; let h=`<b>${jal(this.labels[i])}</b> <span class="muted">${this.labels[i]}</span>`;
    this.panes.forEach(p=>p.series.forEach(s=>{ if(s.type==="band"||s.noTip) return; const v=s.type==="candle"?s.c[i]:s.data[i]; if(v==null) return;
      h+=`<br><span style="color:${s.color||"var(--text)"}">●</span> ${s.name}: <span style="direction:ltr;display:inline-block">${(s.fmt||this.fmt)(v)}</span>`;
      if(s.type==="candle"&&s.o[i]!=null) h+=` <span class="muted">(ب ${this.fmt(s.h[i])} / پ ${this.fmt(s.l[i])})</span>`;}));
    this.tip.innerHTML=h; this.tip.style.display="block"; const r=this.cv.getBoundingClientRect(),hr=this.host.getBoundingClientRect();
    let left=e.clientX-hr.left+14; if(left>hr.width-190) left=e.clientX-hr.left-200; this.tip.style.left=Math.max(0,left)+"px"; this.tip.style.top=Math.max(0,e.clientY-hr.top-10)+"px"; }
  draw(){ const cv=this.cv, dpr=devicePixelRatio||1, W=cv.clientWidth; if(!W) return; cv.width=W*dpr; cv.height=this.H*dpr; const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
    const css=getComputedStyle(document.documentElement), C=n=>css.getPropertyValue(n).trim(); g.clearRect(0,0,W,this.H); g.font="11px sans-serif";
    const a=Math.floor(this.i0), b=Math.ceil(this.i1), span=this.i1-this.i0, xOf=i=>4+(i-this.i0+.5)/span*(W-64);
    let y0=4;
    this.panes.forEach(p=>{ let mn=Infinity,mx=-Infinity; const add=v=>{if(v!=null&&isFinite(v)){mn=Math.min(mn,v);mx=Math.max(mx,v)}};
      p.series.forEach(s=>{ for(let i=a;i<b&&i<this.n;i++){ if(s.type==="candle"){add(s.h[i]);add(s.l[i])} else if(s.type==="band"){add(s.lo[i]);add(s.hi[i])} else add(s.data[i]); } });
      (p.lines||[]).forEach(l=>add(l.y)); if(!isFinite(mn)){mn=0;mx=1} const pad=(mx-mn)*.06||1; mn-=pad; mx+=pad; if(p.min!=null)mn=p.min; if(p.max!=null)mx=p.max;
      const yOf=v=>y0+p.h-4-(v-mn)/(mx-mn)*(p.h-8);
      g.strokeStyle=C("--line"); g.fillStyle=C("--muted"); g.lineWidth=1; g.textAlign="left";
      for(let k=0;k<=4;k++){ const v=mn+(mx-mn)*k/4, y=yOf(v); g.beginPath(); g.moveTo(0,y); g.lineTo(W-58,y); g.globalAlpha=.5; g.stroke(); g.globalAlpha=1; g.fillText((p.fmt||this.fmt)(v),W-56,y+4); }
      (p.lines||[]).forEach(l=>{ g.strokeStyle=l.color||C("--muted"); g.setLineDash([4,4]); const y=yOf(l.y); g.beginPath(); g.moveTo(0,y); g.lineTo(W-58,y); g.stroke(); g.setLineDash([]); });
      g.save(); g.beginPath(); g.rect(0,y0,W-58,p.h); g.clip();
      p.series.forEach(s=>{ const col=s.color&&s.color.startsWith("--")?C(s.color):s.color||C("--text");
        if(s.type==="band"){ g.fillStyle=col; g.globalAlpha=.18; g.beginPath(); let st=false; for(let i=a;i<b&&i<this.n;i++){ if(s.hi[i]==null)continue; const x=xOf(i),y=yOf(s.hi[i]); st?g.lineTo(x,y):g.moveTo(x,y); st=true; }
          for(let i=Math.min(b,this.n)-1;i>=a;i--){ if(s.lo[i]==null)continue; g.lineTo(xOf(i),yOf(s.lo[i])); } g.closePath(); g.fill(); g.globalAlpha=1; }
        else if(s.type==="candle"){ const w=Math.max(1,(W-64)/span*.7); for(let i=a;i<b&&i<this.n;i++){ if(s.c[i]==null||s.h[i]==null)continue; const up=s.o[i]!=null?s.c[i]>=s.o[i]:true, cc=s.o[i]==null?C("--muted"):(up?C("--up"):C("--down")), x=xOf(i);
            g.strokeStyle=cc; g.fillStyle=cc; g.beginPath(); g.moveTo(x,yOf(s.h[i])); g.lineTo(x,yOf(s.l[i])); g.stroke(); if(s.o[i]!=null){ const t=yOf(Math.max(s.o[i],s.c[i])), bt=yOf(Math.min(s.o[i],s.c[i])); g.fillRect(x-w/2,t,w,Math.max(1,bt-t)); } else { g.fillRect(x-w/2,yOf(s.c[i])-1,w,2);} } }
        else if(s.type==="bars"){ const w=Math.max(1,(W-64)/span*.7), z=yOf(0); for(let i=a;i<b&&i<this.n;i++){ const v=s.data[i]; if(v==null)continue; g.fillStyle=v>=0?C("--up"):C("--down"); g.fillRect(xOf(i)-w/2,Math.min(z,yOf(v)),w,Math.abs(yOf(v)-z)||1); } }
        else if(s.type==="dots"){ g.fillStyle=col; for(let i=a;i<b&&i<this.n;i++){ if(s.data[i]==null)continue; g.beginPath(); g.arc(xOf(i),yOf(s.data[i]),4,0,7); g.fill(); } }
        else { g.strokeStyle=col; g.lineWidth=s.w||1.4; g.setLineDash(s.dash||[]); g.beginPath(); let st=false; for(let i=a;i<b&&i<this.n;i++){ const v=s.data[i]; if(v==null){st=false;continue} const x=xOf(i),y=yOf(v); st?g.lineTo(x,y):g.moveTo(x,y); st=true; } g.stroke(); g.setLineDash([]); g.lineWidth=1; } });
      g.restore(); if(p.title){g.fillStyle=C("--muted");g.textAlign="right";g.fillText(p.title,W-70,y0+12);} y0+=p.h; });
    // x labels
    g.fillStyle=C("--muted"); for(let k=0;k<=5;k++){ g.textAlign=k===0?"left":k===5?"right":"center"; const i=Math.round(this.i0+span*k/5-.5), ii=Math.max(0,Math.min(this.n-1,i)); g.fillText(jal(this.labels[ii]),xOf(ii),this.H-6); }
    if(this.cross){ g.strokeStyle=C("--muted"); g.setLineDash([3,3]); const x=xOf(this.cross.idx); g.beginPath(); g.moveTo(x,0); g.lineTo(x,this.H-16); g.stroke(); g.setLineDash([]); } }
}
function rangeBar(ch,onDays){ const mk=(l,k)=>`<button data-k="${k}">${l}</button>`; return `<div class="toolbar">${mk("۱ ماه",22)}${mk("۳ ماه",66)}${mk("۶ ماه",130)}${mk("۱ سال",260)}${mk("۲ سال",520)}${mk("همه",0)}<span class="note">چرخ ماوس: زوم — کشیدن: جابجایی</span></div>`; }
function bindRange(root,ch){ root.querySelectorAll(".toolbar [data-k]").forEach(b=>b.onclick=()=>ch.setRange(+b.dataset.k)); }

// ---------- pages ----------
const V=()=>$("#view"); const need=()=>{ if(!S.snap){ V().innerHTML=`<div class="empty"><span class="spin"></span>${esc(S.engine.message||"در حال تحلیل داده‌ها (بار اول حدود چند ثانیه تا یک دقیقه)…")}${S.engine.state==="running"?" "+nf((S.engine.progress||0)*100,0)+"٪":""}</div>`; return false;} return true; };
function quoteCard(sym,s){ const q=s.quotes[sym]||{}, mk=s.last_bar; const stale=q.stale; 
  return `<div class="card"><h3>${NAMES[sym]} <span class="tag">${UNITS[sym]}</span></h3>${q.price!=null?`<div class="big">${nf(q.price,sym==="XAU_USD"?2:0)}</div>`:'<div class="empty">بدون داده</div>'}
  <div class="note">${q.price==null?"":(stale?`<span class="warn">⚠ کهنه — ${nf(q.age_minutes/60,1)} ساعت قبل از ${q.source}؛ به‌عنوان قیمت لحظه‌ای نمایش داده نمی‌شود</span>`:`<span class="up">زنده</span> · ${q.source} · ${nf(q.age_minutes,0)} دقیقه قبل`)}</div></div>`; }
async function pDashboard(){ if(!need())return; const s=S.snap, d=s.decision, e=s.technical.explain, r=s.regime, f=s.forecast; const stale=Object.values(s.quotes).some(q=>q.stale);
  const lastClose=`<div class="card"><h3>آخرین کلوز کامل طلای ۱۸ <span class="tag">${jal(s.last_bar.date)}</span></h3><div class="big">${nf(s.last_bar.close)}</div><div class="${cls(s.last_bar.change_pct)}">${pc(s.last_bar.change_pct)} نسبت به کلوز قبل</div></div>`;
  const prem=s.intermarket.live.valid?s.intermarket.live.premium_pct:s.intermarket.premium.last_close_based;
  const hz=f?Object.keys(f.horizons).map(h=>{const x=f.horizons[h];return `<tr><td>${nf(h)} روز</td><td class="n">${nf(x.pred_price)}</td><td class="n ${cls(x.pred_return)}">${pc(x.pred_return*100)}</td><td class="n">${nf(x.lower)} – ${nf(x.upper)}</td><td>${x.ensemble_active?"Ensemble فعال":'<span class="muted">بدون برتری آماری</span>'}</td></tr>`}).join(""):"";
  V().innerHTML=`<div class="grid g4">${quoteCard("GOLD18_IRR",s)}${quoteCard("USD_IRR",s)}${quoteCard("XAU_USD",s)}${lastClose}</div>
  ${stale?`<div class="card" style="margin-top:12px;border-color:var(--warn)"><span class="warn">⚠ قیمت‌های لحظه‌ای کهنه‌اند. «به‌روزرسانی» را بزنید (نیازمند اینترنت). تحلیل‌ها بر اساس آخرین کلوز کامل (${jal(s.meta.data_cutoff)}) است.</span></div>`:""}
  <div class="grid g2" style="margin-top:12px"><div class="card" style="grid-column:1/-1"><h3>نمودار اصلی طلای ۱۸ عیار</h3><div id="ch"></div></div></div>
  <div class="grid g4" style="margin-top:12px">

function pBacktest(){ if(!need())return; const s=S.snap,b=s.backtest; if(!b){V().innerHTML='<div class="empty">بک‌تست در حال اجراست…</div>';return;} const h=String(S.hz), r=b[h], pro=S.mode==="pro";
  const rows=Object.entries(r.models).filter(([k,m])=>m.valid).map(([k,m])=>`<tr style="${k==="ensemble"?"font-weight:700":""}"><td>${esc(m.label)}</td><td class="n">${nf(m.n)}</td><td class="n">${nf(m.mae*100,3)}</td><td class="n">${nf(m.rmse*100,3)}</td><td class="n ${m.rmse_ratio<0.99?"up":m.rmse_ratio>1.01?"down":""}">${nf(m.rmse_ratio,3)}</td><td class="n">${nf(m.mase_vs_rw,3)}</td><td class="n">${nf(m.smape_price,3)}</td><td class="n">${m.dir_acc==null?"—":nf(m.dir_acc*100,1)+"٪"}</td><td class="n muted">${m.base_up_rate==null?"—":nf(m.base_up_rate*100,1)+"٪"}</td><td class="n">${m.interval_80_coverage==null?"—":nf(m.interval_80_coverage*100,1)+"٪"}</td><td class="n">${m.dm_p==null?"—":nf(m.dm_p,3)}</td></tr>`).join("");
  const t=s.tracking;
  V().innerHTML=`<div class="toolbar">${Object.keys(b).map(k=>`<button data-h="${k}" class="${k===h?"on":""}">${nf(k)} روزه</button>`).join("")}</div>
  <div class="card"><h3>Walk-Forward (انبساطی، فاصله‌ی embargo برابر افق) — بازده ${nf(h)} روزه</h3><div style="overflow:auto"><table><tr><th>مدل</th><th>n</th><th>MAE٪</th><th>RMSE٪</th><th>RMSE/RW</th><th>MASE</th><th>sMAPE٪ قیمت</th><th>دقت جهت</th><th>نرخ پایه صعود</th><th>پوشش ۸۰٪</th><th>DM p</th></tr>${rows}</table></div>
  <div class="note">RMSE/RW کمتر از ۱ یعنی بهتر از Random Walk. Ensemble: <b>${r.ensemble_enabled?"فعال":"غیرفعال"}</b> (شرط فعال‌سازی: کاهش RMSE حداقل ۱٪ و p&lt;۰٫۱ در آزمون Diebold–Mariano). نمونه‌ها هم‌پوشان‌اند و تعداد مؤثر کمتر از n است. ${esc(s.backtest&&"")}</div></div>
  <div class="card" style="margin-top:12px"><h3>خطای اخیر سری نهایی (بازده واقعی − پیش‌بینی)</h3><div id="ch"></div></div>
  <div class="card pro-only" style="margin-top:12px"><h3>عملکرد در رژیم‌های بازار (Ensemble، افق ${nf(h)})</h3><table><tr><th>رژیم</th><th>n</th><th>RMSE/RW</th><th>دقت جهت</th></tr>${Object.entries(r.models.ensemble.by_regime||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf(v.n)}</td><td class="n">${nf(v.rmse_ratio,3)}</td><td class="n">${v.dir_acc==null?"—":nf(v.dir_acc*100,1)+"٪"}</td></tr>`).join("")}</table></div>
  <div class="card" style="margin-top:12px"><h3>ردیابی پیش‌بینی‌های ثبت‌شده</h3><div class="note">کل ثبت‌شده: ${nf(t.total)} · تسویه‌شده: ${nf(t.resolved.reduce((a,x)=>a+x.n,0))}. ${esc(t.note)}</div><table><tr><th>داده تا</th><th>افق</th><th>پیش‌بینی</th><th>بازه</th><th>سیگنال</th><th>واقعی</th><th>در بازه؟</th></tr>${t.recent.map(x=>`<tr><td>${jal(x.data_cutoff)}</td><td>${nf(x.horizon_days)}</td><td class="n">${nf(x.predicted_price)}</td><td class="n">${nf(x.lower_bound)} – ${nf(x.upper_bound)}</td><td>${esc(x.signal)}</td><td class="n">${nf(x.actual_price)}</td><td>${x.in_interval==null?"در انتظار":x.in_interval?"✓":"✗"}</td></tr>`).join("")}</table></div>`;
  V().querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>{S.hz=+x.dataset.h;pBacktest()});
  const e=s.errors[h]; new Chart($("#ch"),{labels:e.dates,panes:[{h:200,fmt:v=>nf(v*100,1)+"٪",lines:[{y:0,color:"#8d9ab0"}],series:[{type:"bars",name:"خطا",data:e.err,fmt:v=>nf(v*100,2)+"٪"}]}]}); }
function pAssistant(){ if(!need())return; V().innerHTML=`<div class="card"><h3>دستیار بازار (پاسخ‌ها فقط از نتایج موتورهای تحلیلی ساخته می‌شوند)</h3><div class="chat" id="chat"><div class="msg a">سلام! درباره‌ی سیگنال، پیش‌بینی، ریسک، پریمیوم، الگوها، دقت مدل‌ها، منابع داده یا سناریوها بپرسید.</div></div>
  <div class="toolbar"><input id="q" style="flex:1" placeholder="مثلاً: ریسک الان چقدر است؟"><button class="pri" id="send">ارسال</button></div>
  <div class="toolbar">${["سیگنال الان چیست؟","ریسک را توضیح بده","دقت مدل‌ها چقدر است؟","سناریوها چیست؟","وضعیت دلار و پریمیوم","گزارش روزانه"].map(t=>`<button class="qq">${t}</button>`).join("")}</div></div>`;
  const send=async t=>{ const c=$("#chat"); c.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(t)}</div>`); try{ const r=await api("/api/assistant",{question:t}); c.insertAdjacentHTML("beforeend",`<div class="msg a">${esc(r.answer)}<div class="note">منبع: ${esc(r.refs.join("، "))} · داده تا ${jal(r.data_cutoff)}${r.llm_used?" · بازنویسی با LLM":""}</div></div>`);}catch(e){c.insertAdjacentHTML("beforeend",`<div class="msg a down">خطا: ${esc(e.message)}</div>`)} c.scrollTop=c.scrollHeight; };
  $("#send").onclick=()=>{const v=$("#q").value.trim(); if(v){$("#q").value="";send(v)}}; $("#q").onkeydown=e=>{if(e.key==="Enter")$("#send").click()}; V().querySelectorAll(".qq").forEach(b=>b.onclick=()=>send(b.textContent)); }
async function pSources(){ const d=await api("/api/sources"); V().innerHTML=`<div class="grid g4">${Object.entries(d.quotes).map(([k,q])=>`<div class="card"><h3>${NAMES[k]}</h3><div class="${q.stale?"warn":"up"}" style="font-weight:700">${q.price==null?"بدون داده":q.stale?"کهنه":"سالم"}</div><div class="note">${esc(q.source)} · ${q.age_minutes!=null?nf(q.age_minutes/60,1)+" ساعت قبل":""}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:12px"><h3>منابع</h3><table><tr><th>منبع</th><th>اولویت</th><th>تعداد رکورد</th><th>اولین</th><th>آخرین</th><th>آخرین دریافت</th></tr>${d.sources.map(s=>`<tr><td>${esc(s.name)}</td><td>${nf(s.priority)}</td><td class="n">${nf(s.observations)}</td><td>${s.first_ts?jal(s.first_ts):"—"}</td><td>${s.last_ts?jal(s.last_ts):"—"}</td><td class="n" style="direction:ltr">${esc(s.last_fetch||"—")}</td></tr>`).join("")}</table></div>
  <div class="grid g2" style="margin-top:12px"><div class="card"><h3>تاریخچه‌ی دریافت‌ها</h3>${d.runs.length?`<table><tr><th>زمان (UTC)</th><th>منبع</th><th>وضعیت</th><th>جدید</th></tr>${d.runs.map(r=>`<tr><td style="direction:ltr">${esc(r.started_at_utc)}</td><td>${esc(r.source)}</td><td class="${r.status==="ok"?"up":"down"}">${r.status==="ok"?"موفق":"خطا"}</td><td>${nf(r.inserted)}</td></tr>`).join("")}</table>`:'<div class="empty">هنوز دریافتی ثبت نشده</div>'}</div>
  <div class="card"><h3>خطاها (لاگ)</h3>${d.log_errors.length?d.log_errors.map(l=>`<div class="note" style="direction:ltr;text-align:left">${esc(l)}</div>`).join(""):'<div class="empty">خطایی ثبت نشده</div>'}</div></div>`; }
async function pAlerts(){ const d=await api("/api/alerts"); V().innerHTML=`<div class="card"><h3>هشدارها</h3>${d.alerts.length?d.alerts.map(a=>`<div class="note">• <span class="tag">${esc(a.severity)}</span> ${esc(a.message_fa)} <span class="muted" style="direction:ltr;display:inline-block">${esc(a.created_at_utc)}</span></div>`).join(""):'<div class="empty">هشداری نیست</div>'}<br><button id="ack">علامت‌گذاری همه به‌عنوان خوانده‌شده</button></div>`; $("#ack").onclick=async()=>{await api("/api/alerts/ack",{});S.alerts0=0;$("#alertN").textContent="0"}; }
async function pSettings(){ const d=await api("/api/alerts"), st=d.settings; V().innerHTML=`<div class="grid g2"><div class="card"><h3>نمایش</h3><div class="toolbar"><button id="t1">تم روشن/تاریک</button><button id="t2">حالت ساده/حرفه‌ای</button></div><div class="note">میانبرها: <b>t</b> تم · <b>m</b> حالت · <b>r</b> به‌روزرسانی · <b>1…9</b> صفحات</div></div>
  <div class="card"><h3>هشدارها</h3><div class="toolbar"><label>حد حرکت روزانه (σ) <input id="ms" type="number" step="0.5" min="1" max="6" value="${st.move_sigma}" style="width:80px"></label><label>حد z پریمیوم <input id="pz" type="number" step="0.5" min="1" max="5" value="${st.premium_z}" style="width:80px"></label></div>
  <div class="toolbar"><label><input type="checkbox" id="ns" ${st.notify_signal_change?"checked":""}> تغییر سیگنال</label><label><input type="checkbox" id="nt" ${st.notify_stale?"checked":""}> داده کهنه</label></div><button class="pri" id="sv">ذخیره</button></div>
  <div class="card"><h3>تحلیل و مدل‌ها</h3><button id="rr">اجرای مجدد کامل تحلیل و بک‌تست</button><div class="note">مدل‌ها و وزن‌ها در بک‌تست ارزیابی می‌شوند و فقط در صورت برتری آماری فعال می‌شوند.</div></div></div>`;
  $("#t1").onclick=toggleTheme; $("#t2").onclick=toggleMode; $("#rr").onclick=async()=>{await api("/api/rerun",{});poll()};
  $("#sv").onclick=async()=>{await api("/api/settings",{move_sigma:+$("#ms").value,premium_z:+$("#pz").value,notify_signal_change:$("#ns").checked,notify_stale:$("#nt").checked});$("#sv").textContent="ذخیره شد ✓"}; }
const ROUTES={dashboard:pDashboard,overview:pOverview,technical:pTechnical,forecast:pForecast,intermarket:pInter,patterns:pPatterns,backtest:pBacktest,assistant:pAssistant,sources:pSources,alerts:pAlerts,settings:pSettings};
async function route(){ const p=(location.hash||"#dashboard").slice(1); S.page=ROUTES[p]?p:"dashboard"; document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("act",a.dataset.p===S.page));
  const needsSnap=["dashboard","forecast","intermarket","patterns","backtest","assistant"].includes(S.page); if(needsSnap&&!S.snap){need();return;} V().innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{ await ROUTES[S.page](); }catch(e){ V().innerHTML=`<div class="card down">خطا در بارگذاری: ${esc(e.message)}</div>`; } }
function toggleTheme(){ store("gt_theme",S.theme==="dark"?"light":"dark"); document.documentElement.dataset.theme=S.theme; route(); }
function toggleMode(){ store("gt_mode",S.mode==="pro"?"simple":"pro"); document.body.classList.toggle("pro",S.mode==="pro"); $("#bMode").textContent="حالت: "+(S.mode==="pro"?"حرفه‌ای":"ساده"); route(); }
async function poll(){ try{ const r=await api("/api/snapshot"); S.status=r.status; S.engine=r.engine||{}; if(r.snapshot){ const first=!S.snap; const changed=!S.snap||r.snapshot.meta.generated_at!==S.snap.meta.generated_at; S.snap=r.snapshot; if(changed){ updateTop(); if(first||["dashboard"].includes(S.page)) route(); } }
    $("#busy").innerHTML=(r.status==="computing"||r.engine.state==="running")?`<span class="spin"></span><span class="note">${esc(r.engine.message||"در حال تحلیل")}</span>`:"";
    $("#conn").className="pill "+(r.status==="ready"?"ok":r.status==="error"?"bad":"warn"); $("#conn").textContent=r.status==="ready"?"سیستم آماده":r.status==="error"?"خطا در تحلیل":"در حال محاسبه";
    if(!S.snap) need(); }catch(e){ $("#conn").className="pill bad"; $("#conn").textContent="قطع ارتباط با سرور"; }
  clearTimeout(S.t); S.t=setTimeout(poll,(S.status==="ready"&&S.engine.state!=="running")?30000:2000); }
function updateTop(){ const s=S.snap; $("#upd").textContent="داده تا "+jal(s.meta.data_cutoff); const n=(s.alerts||[]).filter(a=>!a.acknowledged).length; $("#alertN").textContent=nf(n); }
function init(){ document.documentElement.dataset.theme=S.theme; document.body.classList.toggle("pro",S.mode==="pro"); $("#bMode").textContent="حالت: "+(S.mode==="pro"?"حرفه‌ای":"ساده");
  $("#nav").innerHTML=PAGES.map(([k,t],i)=>`<a href="#${k}" data-p="${k}">${t}</a>`).join(""); $("#bTheme").onclick=toggleTheme; $("#bMode").onclick=toggleMode; $("#bAlert").onclick=()=>location.hash="#alerts";
  $("#bRefresh").onclick=async()=>{ $("#bRefresh").disabled=true; try{await api("/api/refresh",{})}catch(e){} setTimeout(()=>{$("#bRefresh").disabled=false},4000); poll(); };
  addEventListener("hashchange",route); addEventListener("keydown",e=>{ if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return; if(e.key==="t")toggleTheme(); else if(e.key==="m")toggleMode(); else if(e.key==="r")$("#bRefresh").click(); else if(/^[1-9]$/.test(e.key)) location.hash="#"+PAGES[+e.key-1][0]; });
  route(); poll(); }
init();
</script>
</body>
